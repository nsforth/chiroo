[package]
name = "chiroo-server"
version = "0.1.0"
edition = "2021"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }

[dependencies]
axum = { version = "0.8", features = ["macros", "tokio"] }
axum-macros = "0.5"
chrono = { version = "0.4", features = ["serde"] }
diesel = { version = "2.3", features = ["postgres", "uuid", "serde_json", "chrono"] }
diesel_migrations = "2.3"
deadpool-diesel = { version = "0.6", features = ["postgres"] }
dotenvy = "0.15"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49", features = ["sync", "macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.23", features = ["fast-rng", "v4", "serde"] }

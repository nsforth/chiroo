[package]
name = "chiroo-server"
version = "0.1.0"
edition = "2021"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }

[dependencies]
async-openai = { version = "0.40", features = ["chat-completion", "byot"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "tokio", "multipart"] }
axum-macros = "0.5"
axum_typed_multipart = "0.16"
cached = { version = "1", features = ["async", "proc_macro"] }
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
typenum = "1"
cookie = "0.18"
diesel = { version = "2.3", features = ["postgres", "uuid", "serde_json", "chrono"] }
diesel_migrations = "2.3"
deadpool-diesel = { version = "0.6", features = ["postgres"] }
dotenvy = "0.15"
futures = "0.3"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
openidconnect = "4"
reqwest = { version = "0.12", features = ["json"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["sync", "macros", "rt-multi-thread"] }
tera = "1"
tokio-stream = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = { version ="0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
qdrant-client = { version = "1.19", features = ["serde"] }
url = "2"
uuid = { version = "1.23", features = ["fast-rng", "v4", "serde"] }

# Chiroo server — built-in default configuration.
#
# Precedence (low -> high): this file, then the -c/--config file, then the
# CHIROO_* environment variables. Only static defaults live here; required
# secrets and endpoints (database, openai, embedding, rerank, oidc) are
# intentionally omitted and must be supplied via the config file or the
# CHIROO_* environment variables.
#
# This file is compiled into the binary; copy it as a starting point for your
# own config file.
#
# Durations use serde's duration format: a string with a unit, e.g. "30s",
# "5m", "2h".

server:
  host: "127.0.0.1"
  port: 3000

internal_api:
  host: "127.0.0.1"
  port: 3001

qdrant:
  url: "http://localhost:6334"
  collection_prefix: "chiroo"
  timeout: "30s"

oidc:
  cleanup_interval: "10m"
  session_ttl_multiplier: 10
  access_token_expires: "5m"

chunking:
  max_chunk_size: 512

search:
  limit: 10
  score_threshold: 0.5
  candidate_limit: 30

branding:
  name: "ChiRoo"
  font_family: "Noto Sans"
  mono_font_family: "Source Code Pro"
